name: Issue 37 branch bootstrap v3

on:
  push:
    branches:
      - feature/issue-37-cli-firewall-ux

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-37-cli-firewall-ux
          fetch-depth: 0

      - name: Stage exact candidate, validate, and remove bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          write_blob() {
            local sha="$1"
            local path="$2"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$sha" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$path"
            test "$(git hash-object "$path")" = "$sha"
          }

          write_blob 2ac7ad2c5537148c95f2950f8b99ecf29b22f5be modules/firewall.sh
          write_blob dc916e1a70ef8212dd22eabf5acefa7ba63fcb81 modules/utils.sh
          write_blob 572f40c0c7b3b5b832a5a956468c229925227c62 sso.sh
          write_blob a68012ac0956ab1edd812e80cb151bf1f1a93342 tests/test_utils.sh

          if grep -Fxq '  echo "0) Back"' modules/rollback.sh; then
            sed -i 's/^  echo "0) Back"$/  menu_secondary "0) Back"/' modules/rollback.sh
          fi
          test "$(grep -Fc '  menu_secondary "0) Back"' modules/rollback.sh)" -eq 1

          chmod 755 tests/test_firewall_bulk.sh tests/test_firewall_bittorrent.sh
          rm -f \
            .github/workflows/issue37-bootstrap.yml \
            .github/workflows/issue37-bootstrap-v2.yml \
            .github/workflows/issue37-bootstrap-v3.yml

          bash -n install.sh sso.sh modules/*.sh
          shellcheck --severity=error install.sh sso.sh modules/*.sh
          bash tests/test_firewall.sh
          bash tests/test_firewall_bulk.sh
          bash tests/test_firewall_bittorrent.sh
          bash tests/test_utils.sh
          bash tests/run.sh
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Finalize Issue 37 candidate'
          git push origin HEAD:feature/issue-37-cli-firewall-ux
