name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(find . -type f -name '*.sh' -not -path './.git/*' -print | sort)
          bash -n "${files[@]}"

      - name: ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail
          shellcheck --version
          mapfile -t files < <(find . -type f -name '*.sh' -not -path './.git/*' -print | sort)
          shellcheck --severity=error "${files[@]}"

      - name: Regression tests
        run: bash tests/run.sh
